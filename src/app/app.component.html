<div id="theme-preview" class="theme-preview">
	<div class="window">
		<div class="title-bar">
			<div class="title-bar-text">Threadbox</div>
			<div class="title-bar-controls">
				<button type="button" aria-label="Minimize"></button>
				<button type="button" aria-label="Maximize"></button>
				<button type="button" aria-label="Close"></button>
			</div>
		</div>
		<div class="window-body">
			<p>Select this sentence to check the highlight. <a href="#theme-preview">Link</a></p>
			<div class="field-row">
				<button type="button">Button</button>
				<button type="button" class="default">Default</button>
				<button type="button" disabled>Disabled</button>
			</div>
			<div class="field-row">
				<label for="theme-preview-name">Name</label>
				<input id="theme-preview-name" type="text" value="thread" />
			</div>
			<div class="field-row">
				<label for="theme-preview-note">Note</label>
				<textarea id="theme-preview-note" rows="2">note</textarea>
			</div>
			<div class="field-row">
				<label for="theme-preview-choice">Choice</label>
				<select id="theme-preview-choice">
					<option>Light</option>
					<option>Dark</option>
				</select>
			</div>
			<div class="field-row">
				<label for="theme-preview-readonly">Read only</label>
				<input id="theme-preview-readonly" type="text" value="read only" readonly />
			</div>
			<div class="field-row">
				<label for="theme-preview-disabled">Disabled</label>
				<input id="theme-preview-disabled" type="text" value="disabled" disabled />
			</div>
			<div class="field-row">
				<input id="theme-preview-check" type="checkbox" checked />
				<label for="theme-preview-check">Check</label>
				<input id="theme-preview-radio" type="radio" name="theme-preview-radio" checked />
				<label for="theme-preview-radio">Radio</label>
			</div>
		</div>
		<div class="status-bar">
			<p class="status-bar-field">Ready</p>
		</div>
	</div>
	s
	<div class="window">
		<div class="title-bar inactive">
			<div class="title-bar-text">Inactive</div>
		</div>
		<div class="window-body field-row-stacked">
			<div class="sunken-panel">Sunken panel</div>
			<table>
				<thead>
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Board</th>
					</tr>
				</thead>
				<tbody>
					<tr class="highlighted">
						<td>Thread</td>
						<td>/b/</td>
					</tr>
					<tr>
						<td>Reply</td>
						<td>/a/</td>
					</tr>
				</tbody>
			</table>
			<ul class="tree-view">
				<li>
					Boards
					<ul>
						<li>Thread</li>
						<li>Reply</li>
					</ul>
				</li>
			</ul>
			<menu role="tablist">
				<li role="tab" aria-selected="true">
					<a href="#theme-preview">Active</a>
				</li>
				<li role="tab">
					<a href="#theme-preview">Other</a>
				</li>
			</menu>
			<div class="window" role="tabpanel">
				<div class="window-body">Tab surface</div>
			</div>
		</div>
	</div>
</div>
<router-outlet />

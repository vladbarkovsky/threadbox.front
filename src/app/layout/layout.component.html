@if (authorizationState() !== authorizationStateEnum.Unknown) {
	<header class="navbar">
		<a class="logo" routerLink="/">
			<img ngSrc="assets/logo.png" width="32" height="32" [alt]="translationKeyEnum.Layout_Logo | translate" />
			<span>Threadbox</span>
		</a>

		<button
			type="button"
			class="menu-button"
			[class.default]="menuOpen()"
			[attr.aria-expanded]="menuOpen()"
			aria-controls="navbar-menu"
			(click)="toggleMenu()"
		>
			{{ translationKeyEnum.Layout_Menu | translate }}
		</button>

		<div id="navbar-menu" class="menu" [class.open]="menuOpen()">
			<app-dropdown
				[label]="translationKeyEnum.Layout_Language | translate"
				selectId="language"
				[options]="languageOptions"
				[value]="activeLanguage()"
				(valueChange)="selectLanguage($event)"
			/>

			<div class="vertical-bar" aria-hidden="true"></div>

			<div class="field-row theme">
				<input id="dark-theme" type="checkbox" [checked]="theme() === themeEnum.Dark" (change)="selectDarkTheme($event)" />
				<label for="dark-theme">{{ translationKeyEnum.Layout_DarkTheme | translate }}</label>
			</div>

			<div class="vertical-bar" aria-hidden="true"></div>

			@if (authorizationState() === authorizationStateEnum.Authenticated) {
				<span
					>{{ translationKeyEnum.Layout_AuthorizedAs | translate }} <span class="username">{{ userName() }}</span></span
				>
				<button type="button" (click)="signOut()">{{ translationKeyEnum.Layout_SignOut | translate }}</button>
			} @else {
				<button type="button" (click)="signIn()">{{ translationKeyEnum.Layout_SignIn | translate }}</button>
			}
		</div>
	</header>

	<div class="page">
		<router-outlet />
	</div>
}

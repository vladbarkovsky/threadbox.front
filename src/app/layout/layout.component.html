@if (authorizationState() !== authorizationStateEnum.Unknown) {
	<header class="navbar">
		<a class="navbar-logo" routerLink="/">
			<img ngSrc="assets/logo.png" width="32" height="32" alt="" />
			<span>Threadbox</span>
		</a>

		<div class="navbar-account">
			@if (authorizationState() === authorizationStateEnum.Authenticated) {
				<span>{{ translationKey.Layout_AuthorizedAs | translate }} {{ userName() }}</span>
				<button type="button" (click)="signOut()">{{ translationKey.Layout_SignOut | translate }}</button>
			} @else {
				<button type="button" (click)="signIn()">{{ translationKey.Layout_SignIn | translate }}</button>
			}
		</div>
	</header>

	<div class="page">
		<router-outlet />
	</div>
}

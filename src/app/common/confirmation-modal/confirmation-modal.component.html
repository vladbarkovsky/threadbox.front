<div class="modal-header">
	<h4 class="modal-title">{{ title ?? translationKey.Common_ConfirmationModal_ConfirmAction | translate }}</h4>
	<button type="button" class="btn-close" (click)="dismiss()" aria-label="Close"></button>
</div>
<div class="modal-body">{{ text | translate }}</div>
<div class="modal-footer justify-content-start">
	<button type="button" class="btn btn-outline-secondary" (click)="close()">
		{{ translationKey.Common_ConfirmationModal_Confirm | translate }}
	</button>
	<button type="button" class="btn btn-outline-secondary" (click)="dismiss()">
		{{ translationKey.Common_ConfirmationModal_Cancel | translate }}
	</button>
</div>

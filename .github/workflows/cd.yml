name: CD
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA'
        required: true
jobs:
  deploy:
    runs-on: self-hosted
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      RELEASE_DIR: /var/www/releases
      DEPLOY_DIR: /var/www/threadbox-front
    steps:
      - name: Deploy archive
        run: |
          ARCHIVE="$RELEASE_DIR/threadbox-front-$COMMIT_SHA.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found: $ARCHIVE"
            exit 1
          fi
          mkdir -p "$DEPLOY_DIR"
          find "$DEPLOY_DIR" -mindepth 1 -delete
          unzip -o "$ARCHIVE" -d "$DEPLOY_DIR"
